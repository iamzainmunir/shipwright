<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="How Shipwright works: the decision-graph pipeline from ticket to shipped app, with multi-repo builds and human gates">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="0.55" stop-color="#5b8cff"/><stop offset="1" stop-color="#34d3ee"/>
    </linearGradient>
    <marker id="ar--" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a91a6"/>
    </marker>
    <marker id="arrew" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0a020"/>
    </marker>
  </defs>

  <!-- card background: light panel so it reads on light AND dark GitHub themes -->
  <rect x="0" y="0" width="1160" height="660" rx="20" fill="#f7f8fc"/>
  <rect x="1" y="1" width="1158" height="658" rx="19" fill="none" stroke="#e4e7f0"/>

  <!-- title -->
  <rect x="34" y="30" width="34" height="34" rx="9" fill="url(#brand)"/>
  <path d="M49 40 L44 51 L49 58 M57 40 L62 51 L57 58" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="46" font-size="22" font-weight="700" fill="#0f1222">How Shipwright works</text>
  <text x="82" y="66" font-size="13.5" fill="#5b6478">You file a ticket — a team of AI agents takes it from spec to a running app. You hold the gates that matter.</text>

  <!-- ============ INPUT ============ -->
  <text x="40" y="112" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a91a6">INPUT</text>
  <rect x="34" y="122" width="182" height="118" rx="12" fill="#fff" stroke="#dfe3ee"/>
  <text x="50" y="148" font-size="14" font-weight="700" fill="#0f1222">🎫 Ticket + Projects</text>
  <text x="50" y="170" font-size="12" fill="#5b6478">“Add an /orders API”</text>
  <rect x="50" y="182" width="150" height="22" rx="6" fill="#efeaff" stroke="#d9ccff"/>
  <text x="60" y="197" font-size="11" fill="#5a45c8">▣ payments-service</text>
  <rect x="50" y="208" width="150" height="22" rx="6" fill="#efeaff" stroke="#d9ccff"/>
  <text x="60" y="223" font-size="11" fill="#5a45c8">▣ api-gateway  (multi-select)</text>

  <!-- arrow input → pipeline -->
  <line x1="216" y1="181" x2="250" y2="181" stroke="#8a91a6" stroke-width="2" marker-end="url(#ar--)"/>

  <!-- ============ PIPELINE (decision graph) ============ -->
  <text x="262" y="112" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a91a6">PIPELINE · a decision graph, not a straight line</text>
  <rect x="256" y="122" width="700" height="230" rx="14" fill="#fff" stroke="#dfe3ee"/>

  <!-- phase boxes -->
  <!-- row of phases -->
  <g font-size="12.5" font-weight="700">
    <rect x="276" y="150" width="96" height="52" rx="10" fill="#eef1fb" stroke="#cdd6f4"/>
    <text x="324" y="172" text-anchor="middle" fill="#0f1222">Spec</text>
    <text x="324" y="190" text-anchor="middle" font-size="10.5" font-weight="500" fill="#848ea0">PM</text>

    <rect x="388" y="150" width="96" height="52" rx="10" fill="#eef1fb" stroke="#cdd6f4"/>
    <text x="436" y="172" text-anchor="middle" fill="#0f1222">Plan</text>
    <text x="436" y="190" text-anchor="middle" font-size="10.5" font-weight="500" fill="#848ea0">PM + CTO</text>

    <rect x="500" y="150" width="120" height="52" rx="10" fill="#efeaff" stroke="#d3c4ff"/>
    <text x="560" y="172" text-anchor="middle" fill="#3b2d80">Build</text>
    <text x="560" y="190" text-anchor="middle" font-size="10.5" font-weight="500" fill="#6a5aa8">Engineers · parallel</text>

    <rect x="636" y="150" width="96" height="52" rx="10" fill="#eef1fb" stroke="#cdd6f4"/>
    <text x="684" y="172" text-anchor="middle" fill="#0f1222">Review</text>
    <text x="684" y="190" text-anchor="middle" font-size="10.5" font-weight="500" fill="#848ea0">CTO</text>

    <rect x="748" y="150" width="96" height="52" rx="10" fill="#eef1fb" stroke="#cdd6f4"/>
    <text x="796" y="172" text-anchor="middle" fill="#0f1222">QA</text>
    <text x="796" y="190" text-anchor="middle" font-size="10.5" font-weight="500" fill="#848ea0">real app run</text>

    <rect x="860" y="150" width="80" height="52" rx="10" fill="#e6f7ee" stroke="#b7e6cd"/>
    <text x="900" y="172" text-anchor="middle" fill="#0f7a43">Ship</text>
    <text x="900" y="190" text-anchor="middle" font-size="10.5" font-weight="500" fill="#3a9c6d">DevOps</text>
  </g>

  <!-- forward arrows between phases -->
  <g stroke="#8a91a6" stroke-width="2" fill="none">
    <line x1="372" y1="176" x2="386" y2="176" marker-end="url(#ar--)"/>
    <line x1="484" y1="176" x2="498" y2="176" marker-end="url(#ar--)"/>
    <line x1="620" y1="176" x2="634" y2="176" marker-end="url(#ar--)"/>
    <line x1="732" y1="176" x2="746" y2="176" marker-end="url(#ar--)"/>
    <line x1="844" y1="176" x2="858" y2="176" marker-end="url(#ar--)"/>
  </g>

  <!-- rework loop: QA/Review send fixes BACK to the failing part only -->
  <path d="M796 202 C796 246, 560 246, 560 206" fill="none" stroke="#f0a020" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrew)"/>
  <text x="600" y="242" font-size="11" font-weight="600" fill="#c67c10">targeted rework → back to the failing part only</text>

  <!-- CTO decision note -->
  <path d="M684 202 C684 224, 620 224, 596 206" fill="none" stroke="#c9cee0" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="286" y="228" font-size="10.5" fill="#848ea0">deterministic gate: nothing ships unless QA actually passes and the build is real</text>

  <!-- human gate marker on Ship -->
  <circle cx="900" cy="150" r="11" fill="#fff" stroke="#f0a020" stroke-width="2"/>
  <text x="900" y="154" text-anchor="middle" font-size="12" fill="#c67c10">✋</text>
  <text x="900" y="330" text-anchor="middle" font-size="10.5" fill="#848ea0"></text>

  <!-- arrow pipeline → output -->
  <line x1="956" y1="181" x2="990" y2="181" stroke="#8a91a6" stroke-width="2" marker-end="url(#ar--)"/>

  <!-- ============ OUTPUT ============ -->
  <text x="996" y="112" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a91a6">OUTPUT</text>
  <rect x="990" y="122" width="140" height="118" rx="12" fill="#fff" stroke="#dfe3ee"/>
  <text x="1005" y="148" font-size="13.5" font-weight="700" fill="#0f1222">🚀 Running app</text>
  <text x="1005" y="170" font-size="11.5" fill="#5b6478">real code on disk</text>
  <text x="1005" y="192" font-size="11.5" fill="#5b6478">per-repo fix/ branch</text>
  <text x="1005" y="214" font-size="11.5" fill="#5b6478">+ PR at the gate</text>

  <!-- ============ MULTI-REPO CALLOUT ============ -->
  <text x="40" y="392" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a91a6">BUILD · coordinated across the selected projects</text>
  <rect x="34" y="402" width="540" height="150" rx="14" fill="#fff" stroke="#dfe3ee"/>
  <text x="52" y="430" font-size="13.5" font-weight="700" fill="#3b2d80">One change, many repos — kept consistent</text>
  <text x="52" y="452" font-size="12" fill="#5b6478">Every agent sees all selected repos (a compact repo-map), so a new</text>
  <text x="52" y="470" font-size="12" fill="#5b6478">API in the service is wired into the gateway in the same run.</text>
  <!-- fan-out -->
  <rect x="58" y="486" width="120" height="46" rx="9" fill="#efeaff" stroke="#d3c4ff"/>
  <text x="118" y="507" text-anchor="middle" font-size="12" font-weight="700" fill="#3b2d80">Build</text>
  <text x="118" y="523" text-anchor="middle" font-size="10" fill="#6a5aa8">shared context</text>
  <g stroke="#8a91a6" stroke-width="1.8" fill="none">
    <line x1="178" y1="500" x2="214" y2="500" marker-end="url(#ar--)"/>
    <line x1="178" y1="518" x2="214" y2="518" marker-end="url(#ar--)"/>
  </g>
  <rect x="216" y="486" width="160" height="20" rx="6" fill="#eef1fb" stroke="#cdd6f4"/>
  <text x="226" y="500" font-size="10.5" fill="#0f1222">payments-service · fix/…</text>
  <rect x="216" y="512" width="160" height="20" rx="6" fill="#eef1fb" stroke="#cdd6f4"/>
  <text x="226" y="526" font-size="10.5" fill="#0f1222">api-gateway · fix/…</text>
  <text x="392" y="500" font-size="11" fill="#848ea0">each on its own</text>
  <text x="392" y="516" font-size="11" fill="#848ea0">branch, reviewed +</text>
  <text x="392" y="532" font-size="11" fill="#848ea0">QA’d together</text>

  <!-- ============ CONTROLS CALLOUT ============ -->
  <text x="596" y="392" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a91a6">YOU STAY IN CONTROL</text>
  <rect x="590" y="402" width="540" height="150" rx="14" fill="#fff" stroke="#dfe3ee"/>
  <g font-size="12" fill="#39415a">
    <text x="610" y="432">✋  <tspan fill="#0f1222" font-weight="600">Autonomy per mission</tspan> — manual → assisted → supervised → autonomous</text>
    <text x="610" y="458">🔒  <tspan fill="#0f1222" font-weight="600">Merge / ship gate</tspan> — the team never force-pushes without your sign-off</text>
    <text x="610" y="484">🔔  <tspan fill="#0f1222" font-weight="600">Notifications</tspan> — email · WhatsApp · Slack on blocker / approval / ship / halt</text>
    <text x="610" y="510">🧩  <tspan fill="#0f1222" font-weight="600">Bring your models</tspan> — Anthropic · OpenAI-compatible · Ollama · Claude CLI</text>
    <text x="610" y="536">🧠  <tspan fill="#0f1222" font-weight="600">Skills &amp; memory</tspan> — reused across missions for consistent decisions</text>
  </g>

  <!-- footer -->
  <text x="40" y="600" font-size="11" fill="#9aa1b2">Every deliverable is real, runnable code — when the team can’t produce something shippable, it stops and asks instead of shipping broken work.</text>
</svg>
