[project]
name = "foundry-core"
version = "0.1.0"
description = "Shipwright shared Python core: domain models (Pydantic v2), enums, ULIDs, settings, and the async DB / tenant-scope layer."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "UNLICENSED" }
authors = [{ name = "Shipwright" }]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-ulid>=3.0",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# Async Postgres drivers the orchestrator/runner select at deploy time. Kept optional so
# importing foundry_core (models/enums/ids) needs no DB driver present.
asyncpg = ["asyncpg>=0.30"]
psycopg = ["psycopg[binary]>=3.2"]
# OpenTelemetry SDK for `foundry_core.tracing`. Optional so importing the base library needs
# no OTel present; services that trace depend on `foundry-core[tracing]` (plan 11 §3).
tracing = [
  "opentelemetry-api>=1.29",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
