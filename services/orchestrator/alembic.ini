# Alembic config for the orchestrator schema (plan 11 §11.4 — migrations replace create_all).
#
# The database URL is NOT hard-coded here: env.py reads it from the app Settings
# (`DATABASE_URL`), and a programmatic caller may override it via the `sqlalchemy.url`
# main option. So the CLI (`uv run alembic upgrade head`) and the app use the same source.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Revision filenames sort chronologically and read clearly: 0001_slug, 0002_slug, ...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
